<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viejas Románticas - Radio en Vivo</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- ESTILOS GENERALES Y TEMA NOCTURNO --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column; /* Apila el reproductor y el footer verticalmente */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0; /* Evita que se corte en pantallas muy pequeñas */
        }

        /* Efecto de estrellas en el fondo */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.8;
            z-index: -1;
        }

        /* --- CONTENEDOR DEL REPRODUCTOR (Efecto Cristal) --- */
        .player-container {
            position: relative;
            width: 90%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
        }

        /* --- DISCO DE VINILO GIRATORIO --- */
        .vinyl-record {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: 
                radial-gradient(circle, #e74c3c 0%, #c0392b 15%, transparent 16%),
                repeating-radial-gradient(#111 0, #111 2px, #1a1a1a 3px, #1a1a1a 4px);
            background-color: #111;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 0 0 2px #000;
            position: relative;
            margin: 0 auto 15px;
            animation: spin 4s linear infinite;
            animation-play-state: paused;
            transition: box-shadow 0.3s ease;
        }

        .vinyl-record::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.1) 100%);
            pointer-events: none;
        }

        .vinyl-record::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 14px; height: 14px;
            background: #090a0f;
            border-radius: 50%;
            border: 2px solid #333;
            z-index: 2;
        }

        .vinyl-record.spinning {
            animation-play-state: running;
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.4), inset 0 0 0 2px #000;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
      .radio-title {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #a0c4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .radio-status {
            margin: 8px 0 20px;
            font-size: 13px;
            color: #00d2ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ff4757;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #ff4757;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* --- ONDAS DE SONIDO ANIMADAS --- */
        .wave-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px;
            gap: 4px;
            margin: 10px 0 25px;
        }

        .wave-bar {
            width: 6px;
            background: linear-gradient(to top, #00d2ff, #3a7bd5);
            border-radius: 3px;
            height: 10px;
            transition: height 0.2s ease;
        }

        .wave-container:not(.paused) .wave-bar {
            animation: wave 1s ease-in-out infinite;
        }

        .wave-container.paused .wave-bar {
            height: 10px !important;
            animation: none;
        }

        .wave-bar:nth-child(1) { animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.3s; }
        .wave-bar:nth-child(4) { animation-delay: 0.4s; }
        .wave-bar:nth-child(5) { animation-delay: 0.5s; }
        .wave-bar:nth-child(6) { animation-delay: 0.6s; }
        .wave-bar:nth-child(7) { animation-delay: 0.7s; }
        .wave-bar:nth-child(8) { animation-delay: 0.8s; }
        .wave-bar:nth-child(9) { animation-delay: 0.9s; }
        .wave-bar:nth-child(10) { animation-delay: 1.0s; }
        .wave-bar:nth-child(11) { animation-delay: 0.9s; }
        .wave-bar:nth-child(12) { animation-delay: 0.8s; }
        .wave-bar:nth-child(13) { animation-delay: 0.7s; }
        .wave-bar:nth-child(14) { animation-delay: 0.6s; }
        .wave-bar:nth-child(15) { animation-delay: 0.5s; }

        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 50px; }
        }

        /* --- BOTÓN DE REPRODUCCIÓN --- */
        .play-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.5);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        /* --- CONTROL DE VOLUMEN --- */
        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            color: #a0c4ff;
        }

        .volume-container input[type="range"] {
            -webkit-appearance: none;
            width: 65%;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
      .volume-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #00d2ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
            transition: transform 0.2s;
        }

        .volume-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* --- REDES SOCIALES DEL REPRODUCTOR --- */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 10px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-btn.facebook {
            background: #1877f2;
            box-shadow: 0 5px 15px rgba(24, 119, 242, 0.3);
        }

        .social-btn.whatsapp {
            background: #25d366;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }

        .social-btn:hover {
            transform: translateY(-5px);
            filter: brightness(1.2);
        }

        /* =========================================
           NUEVO: PIE DE PÁGINA PROMOCIONAL (FOOTER)
           ========================================= */
        .promo-footer {
            width: 90%;
            max-width: 450px;
            text-align: center;
            margin-top: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
        }

        .promo-footer p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .promo-footer strong {
            color: #ffffff;
            font-weight: 700;
        }

        .whatsapp-promo-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(37, 211, 102, 0.15);
            border: 1px solid rgba(37, 211, 102, 0.4);
            color: #25d366;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .whatsapp-promo-btn i {
            font-size: 20px;
        }

        .whatsapp-promo-btn:hover {
            background: #25d366;
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
            transform: translateY(-3px);
            border-color: #25d366;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 400px) {
            .player-container {
                width: 95%;
                padding: 25px 15px;
            }
            .radio-title {
                font-size: 22px;
            }
            .vinyl-record {
                width: 90px;
                height: 90px;
            }
            .promo-footer p {
                font-size: 13px;
            }
            .whatsapp-promo-btn {
                width: 100%; /* Botón ancho completo en móviles muy pequeños */
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR PRINCIPAL -->
  <div class="player-container">
        <div class="vinyl-record" id="vinylRecord"></div>

        <h1 class="radio-title">Viejas Románticas</h1>
        <p class="radio-status">
            <span class="live-dot"></span> EN VIVO
        </p>

        <div class="wave-container paused" id="waveContainer">
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        </div>

        <button id="playPauseBtn" class="play-btn" aria-label="Reproducir o Pausar">
            <i class="fas fa-play"></i>
        </button>

        <div class="volume-container">
            <i class="fas fa-volume-down"></i>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
            <i class="fas fa-volume-up"></i>
        </div>

        <div class="social-links">
            <a href="https://facebook.com/viejasromanticas" target="_blank" class="social-btn facebook" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://wa.me/541134220329" target="_blank" class="social-btn whatsapp" aria-label="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
    </div>

    <!-- PIE DE PÁGINA PROMOCIONAL -->
    <footer class="promo-footer">
        <p>Adquirí tu Streaming de audio con tu sitio Web y transmití tu radio a todo el mundo<br><strong></strong></p>
        <a href="https://wa.me/541134229329?text=quiero%20mi%20Radio%20Online" target="_blank" class="whatsapp-promo-btn">
            <i class="fab fa-whatsapp"></i> WHATSAPP
        </a>
    </footer>

    <!-- Elemento de Audio Oculto -->
    <audio id="radioStream" src="https://stream.zeno.fm/urmfkad2em0uv" preload="none"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('radioStream');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const waveContainer = document.getElementById('waveContainer');
            const vinylRecord = document.getElementById('vinylRecord');
            const volumeSlider = document.getElementById('volumeSlider');

            function updatePlayState(isPlaying) {
                if (isPlaying) {
                    playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    waveContainer.classList.remove('paused');
                    vinylRecord.classList.add('spinning');
                } else {
                    playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                    waveContainer.classList.add('paused');
                    vinylRecord.classList.remove('spinning');
                }
            }

            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    updatePlayState(true);
                }).catch(error => {
                    console.log("Autoplay bloqueado por el navegador. Esperando interacción del usuario.");
                    updatePlayState(false);
                });
            }

            playPauseBtn.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play();
                    updatePlayState(true);
                } else {
                    audio.pause();
                    updatePlayState(false);
                }
            });

            volumeSlider.addEventListener('input', (e) => {
                audio.volume = e.target.value;
            });
          audio.addEventListener('error', () => {
                console.error("Error al cargar el stream de audio.");
                updatePlayState(false);
            });
        });
    </script>
</body>
</html>
